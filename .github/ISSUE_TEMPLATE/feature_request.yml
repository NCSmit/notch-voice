name: Feature request
description: Suggest an idea for NotchVoice.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the moment where NotchVoice falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could NotchVoice do?
      description: Describe how you picture it working.
    validations:
      required: true
